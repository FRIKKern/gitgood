name: Verify native forge
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  forge-and-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ImageOS: ubuntu24
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: gitgood
      PGPASSWORD: synthetic-db-password
      GITGOOD_TEST_DATABASE_LOCALE: 'true'
      GITGOOD_PYTHON: /usr/bin/python3
      GITGOOD_ROOT_PROBE_PYTHON: /var/lib/gitgood-root-runtime-probe/pypy3.11-v8.0.1-linux64/bin/pypy3.11
      GITGOOD_GIT: /usr/bin/git
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify native build platform
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          test -n "$GITHUB_WORKSPACE"
          test "$GITHUB_WORKSPACE" != /
          test -d "$GITHUB_WORKSPACE"
          test ! -L "$GITHUB_WORKSPACE"
          test "$(realpath "$GITHUB_WORKSPACE")" = "$GITHUB_WORKSPACE"
          test "$(stat -c %u "$GITHUB_WORKSPACE")" = "$(id -u)"
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
      - name: Install native build tools
        run: |
          set -euo pipefail
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends build-essential python3-dev unzip openssh-client systemd patchelf
          command -v cc
          command -v make
          command -v unzip
          command -v ssh
          command -v ssh-keygen
          test -x "$GITGOOD_PYTHON"
          test -x "$GITGOOD_GIT"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '29.1.1'
          elixir-version: '1.20.4'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Prepare private Node runtime for native verification
        run: |
          set -euo pipefail
          umask 077
          version="$(cat .node-version)"
          [[ "$version" =~ ^22\.[0-9]+\.[0-9]+$ ]]
          selected_node="$(realpath "$(command -v node)")"
          test "$selected_node" = "$(realpath "$RUNNER_TOOL_CACHE")/node/$version/x64/bin/node"
          stat -c 'Selected Node: %n mode=%a uid=%u bytes=%s' "$selected_node"
          test "$("$selected_node" --version)" = "v$version"
          parent="$GITHUB_WORKSPACE/.gitgood"
          test ! -L "$parent"
          if test -e "$parent"; then
            test -d "$parent"
            test "$(stat -c %u "$parent")" = "$(id -u)"
          else
            mkdir -m 0700 "$parent"
          fi
          test "$(realpath "$parent")" = "$parent"
          runtime="$parent/ci-node"
          test ! -e "$runtime"
          test ! -L "$runtime"
          mkdir -m 0700 "$runtime" "$runtime/bin"
          test "$(realpath "$runtime")" = "$runtime"
          test "$(stat -c %u "$runtime")" = "$(id -u)"
          source_sha="$(sha256sum "$selected_node" | cut -d ' ' -f 1)"
          install -m 0755 "$selected_node" "$runtime/bin/node"
          cmp -- "$selected_node" "$runtime/bin/node"
          test "$(sha256sum "$selected_node" | cut -d ' ' -f 1)" = "$source_sha"
          test "$(sha256sum "$runtime/bin/node" | cut -d ' ' -f 1)" = "$source_sha"
          test "$("$runtime/bin/node" --version)" = "v$version"
          "$GITGOOD_PYTHON" -c 'import json, sys; sys.path.insert(0, "tools/deployment"); from native_inventory import executable_identity; print(json.dumps(executable_identity(sys.argv[1]), sort_keys=True))' "$runtime/bin/node"
          printf '%s\n' "$runtime/bin" >> "$GITHUB_PATH"
      - name: Build pinned native PostgreSQL server and recovery clients
        run: |
          set -euo pipefail
          bash tools/ci/test-postgres-workspace.sh
          sudo -n apt-get install -y --no-install-recommends pkg-config zlib1g-dev libssl-dev bison flex
          bash tools/ci/install-postgres-18.4.sh "$GITHUB_WORKSPACE/.gitgood/postgres-18.4"
          echo "$GITHUB_WORKSPACE/.gitgood/postgres-18.4/bin" >> "$GITHUB_PATH"
      - name: Start isolated native PostgreSQL
        run: |
          set -euo pipefail
          umask 077
          cluster="$GITHUB_WORKSPACE/.gitgood/postgres-cluster"
          test ! -e "$cluster"
          printf '%s\n' "$PGPASSWORD" > .gitgood/postgres-fixture-password
          initdb -D "$cluster" -U "$PGUSER" --auth=scram-sha-256 --pwfile=.gitgood/postgres-fixture-password --encoding=UTF8 --locale=C.UTF-8 --locale-provider=libc
          pg_ctl -D "$cluster" -l .gitgood/postgres-private.log -o '-h 127.0.0.1 -p 5432' -w start
          test "$(psql -d postgres -Atc 'SHOW server_version')" = 18.4
          getconf GNU_LIBC_VERSION
      - run: mix deps.get --check-locked && mix precommit && mix format --check-formatted
        working-directory: apps/forge
      - name: Verify native artifact preflight refusal boundaries
        run: python3 -m unittest discover -s tools/deployment -p 'test_*.py' -v
      - name: Verify real database recovery and VM crashes
        working-directory: apps/forge
        env:
          PGDATABASE: gitgood_recovery
          GITGOOD_STORAGE: .gitgood/recovery
        run: |
          mix ecto.create
          mix ecto.migrate
          mix run verification/merge_recovery.exs
          for point in before_ref after_ref before_outcome; do
            set +e
            GITGOOD_FAILURE_POINT="$point" mix run verification/vm_crash.exs
            result=$?
            set -e
            test "$result" -eq 70
            GITGOOD_FAILURE_POINT=reconcile mix run verification/vm_crash.exs
            cp .gitgood/verification/vm-crash.json ".gitgood/verification/vm-crash-$point.json"
          done
          for point in before_validation before_ref after_ref before_outcome; do
            set +e
            GITGOOD_FAILURE_POINT="$point" mix run verification/import_vm_crash.exs
            result=$?
            set -e
            test "$result" -eq 70
            GITGOOD_FAILURE_POINT=reconcile mix run verification/import_vm_crash.exs
            cp .gitgood/verification/import-vm-crash.json ".gitgood/verification/import-vm-crash-$point.json"
          done
          for point in before_commit after_commit; do
            set +e
            GITGOOD_FAILURE_POINT="$point" mix run verification/release_vm_crash.exs
            result=$?
            set -e
            test "$result" -eq 70
            GITGOOD_FAILURE_POINT=reconcile mix run verification/release_vm_crash.exs
            cp .gitgood/verification/release-vm-crash.json ".gitgood/verification/release-vm-crash-$point.json"
          done
      - name: Verify populated discovery upgrade and fresh VM
        working-directory: apps/forge
        run: |
          export PGDATABASE="gitgood_activity_upgrade_$(openssl rand -hex 4)"
          export GITGOOD_STORAGE="$PWD/.gitgood/discovery-upgrade"
          GITGOOD_DISCOVERY_MODE=prepare mix run --no-start verification/discovery_upgrade.exs
          GITGOOD_DISCOVERY_MODE=check mix run --no-start verification/discovery_upgrade.exs
      - run: npm ci && npm run check
        working-directory: apps/web
      - name: Verify authenticated recovery bundle and schema boundaries
        run: node --test apps/forge/test/operations/*.test.mjs
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Install pinned direct-edge verification runtime
        run: |
          mkdir -p .gitgood/caddy-2.11.7
          curl -fsSL --retry 2 https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz -o .gitgood/caddy-2.11.7/package.tar.gz
          echo 'a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7  .gitgood/caddy-2.11.7/package.tar.gz' | sha512sum --check
          tar -xzf .gitgood/caddy-2.11.7/package.tar.gz -C .gitgood/caddy-2.11.7 caddy
          echo "GITGOOD_CADDY=$PWD/.gitgood/caddy-2.11.7/caddy" >> "$GITHUB_ENV"
      - name: Build clean production artifacts
        run: |
          npm run build --prefix apps/web
          node scripts/stamp-build.mjs
          cd apps/forge
          MIX_ENV=prod mix release
      - name: Prepare copied production web dependencies for native ownership proof
        run: |
          set -euo pipefail
          mkdir .gitgood/native-web-product
          cp -R apps/web/dist .gitgood/native-web-product/dist
          cp apps/web/{server.mjs,client-address.mjs,package.json,package-lock.json} .gitgood/native-web-product/
          npm ci --omit=dev --ignore-scripts --prefix .gitgood/native-web-product
      - name: Verify protected artifact Root filesystem effects
        # Admission and budgeting are stand-ins; filesystem effects are actual.
        run: sudo -n "$GITGOOD_PYTHON" -B -m unittest discover -s tools/deployment -p 'test_native_protected_artifact.py' -v
      - name: Verify Root lifecycle input descriptors
        # Scratch ancestor policy is a stand-in; UID/file descriptors are actual.
        run: sudo -n "$GITGOOD_PYTHON" -B -m unittest discover -s tools/deployment -p 'test_native_root_lifecycle.py' -v
      - name: Verify serialized Root artifact policy filesystem
        # Controller/exclusion, capacity and scratch ancestors are stand-ins;
        # inspection, descriptor custody, flock and publication are actual.
        run: sudo -n "$GITGOOD_PYTHON" -B -m unittest discover -s tools/deployment -p 'test_native_root_artifact_policy.py' -v
      - name: Verify ordinary artifact output and Root dispatch components
        # Controller admission/path mapping are stand-ins for output tests;
        # Root extraction, output identities and content reads are actual.
        run: |
          sudo -n "$GITGOOD_PYTHON" -B -m unittest discover -s tools/deployment -p 'test_native_artifact_controller.py' -v
          sudo -n "$GITGOOD_PYTHON" -B -m unittest discover -s tools/deployment -p 'test_native_root_artifact_dispatch.py' -v
          sudo -n "$GITGOOD_PYTHON" -B -m unittest discover -s tools/deployment -p 'test_native_artifact_canonical_paths.py' -v
          sudo -n "$GITGOOD_PYTHON" -B -m unittest discover -s tools/deployment -p 'test_native_root_observation_pass.py' -v
          sudo -n "$GITGOOD_PYTHON" -B -m unittest discover -s tools/deployment -p 'test_native_root_database_reader.py' -v
          sudo -n "$GITGOOD_PYTHON" -B -m unittest discover -s tools/deployment -p 'test_native_tcp_socket_observation.py' -v
          sudo -n "$GITGOOD_PYTHON" -B -m unittest discover -s tools/deployment -p 'test_native_service_file_custody.py' -v
          sudo -n "$GITGOOD_PYTHON" -B -m unittest discover -s tools/deployment -p 'test_native_root_file_parent_plan.py' -v
          sudo -n "$GITGOOD_PYTHON" -B -m unittest discover -s tools/deployment -p 'test_native_process_status.py' -v
          sudo -n "$GITGOOD_PYTHON" -B -m unittest discover -s tools/deployment -p 'test_native_systemd_properties.py' -v
          sudo -n "$GITGOOD_PYTHON" -B -m unittest discover -s tools/deployment -p 'test_native_executable_capture.py' -v
          sudo -n "$GITGOOD_PYTHON" -B -m unittest discover -s tools/deployment -p 'test_native_durable_binding.py' -v
          sudo -n "$GITGOOD_PYTHON" -B -m unittest discover -s tools/deployment -p 'test_native_persistent_fingerprint.py' -v
          sudo -n "$GITGOOD_PYTHON" -B -m unittest discover -s tools/deployment -p 'test_native_private_directory.py' -v
          sudo -n "$GITGOOD_PYTHON" -B -m unittest discover -s tools/deployment -p 'test_native_root_configuration.py' -v
          sudo -n "$GITGOOD_PYTHON" -B -m unittest discover -s tools/deployment -p 'test_native_stage_controller_observer.py' -v
      - name: Compare fresh native fingerprint on owned Linux files
        run: |
          set -euo pipefail
          "$GITGOOD_PYTHON" -B tools/ci/native-fingerprint-build.py
          sudo -n "$GITGOOD_PYTHON" -B tools/ci/native-fingerprint-test.py
      - name: Verify fixed Root SELECT preparation on hosted PostgreSQL
        run: |
          set -euo pipefail
          "$GITGOOD_PYTHON" -B tools/ci/native-prepared-test.py
      - name: Install checksum-verified diagnostic Root runtime
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo -n "$GITGOOD_PYTHON" -B tools/ci/root-runtime-test.py
          sudo -n env \
            "GITHUB_ACTIONS=$GITHUB_ACTIONS" \
            "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            "$GITGOOD_PYTHON" -B tools/ci/root_runtime_probe.py --install
      - name: Verify PyPy Root component compatibility
        timeout-minutes: 10
        run: |
          set -euo pipefail
          for module in \
            test_native_protected_artifact test_native_root_lifecycle test_native_root_artifact_policy \
            test_native_artifact_controller test_native_root_artifact_dispatch test_native_artifact_canonical_paths \
            test_native_root_observation_pass test_native_root_database_reader test_native_tcp_socket_observation \
            test_native_service_file_custody test_native_root_file_parent_plan test_native_process_status \
            test_native_systemd_properties test_native_executable_capture test_native_durable_binding \
            test_native_persistent_fingerprint test_native_private_directory test_native_root_configuration \
            test_native_stage_controller_observer test_native_root_live_binding; do
            sudo -n "$GITGOOD_ROOT_PROBE_PYTHON" -B -m unittest discover -s tools/deployment -p "$module.py" -v
          done
          sudo -n env "GITHUB_ACTIONS=$GITHUB_ACTIONS" "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            "PGHOST=$PGHOST" "PGPORT=$PGPORT" "PGUSER=$PGUSER" "PGPASSWORD=$PGPASSWORD" \
            "$GITGOOD_ROOT_PROBE_PYTHON" -B tools/ci/native-prepared-test.py
      - name: Verify protected native ownership on actual systemd
        # Adds complete production archive staging and content verification;
        # this hosted test budget does not alter production operation deadlines.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          "$GITGOOD_PYTHON" -B tools/ci/native-owned-test.py
          sudo -n env \
            "GITHUB_ACTIONS=$GITHUB_ACTIONS" \
            "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            "PGHOST=$PGHOST" "PGPORT=$PGPORT" \
            "PGUSER=$PGUSER" "PGPASSWORD=$PGPASSWORD" \
            "$GITGOOD_ROOT_PROBE_PYTHON" -B tools/ci/native-owned-proof.py \
              --workspace "$GITHUB_WORKSPACE" \
              --release "$GITHUB_WORKSPACE/apps/forge/_build/prod/rel/gitgood" \
              --postgres "$GITHUB_WORKSPACE/.gitgood/postgres-18.4" \
              --node "$(command -v node)" \
              --caddy "$GITGOOD_CADDY" \
              --candidate "$GITHUB_SHA" \
              --output "$GITHUB_WORKSPACE/.gitgood/native-owned-proof"
      - name: Verify copied production installation
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          group="/sys/fs/cgroup/gitgood-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$group"
          sudo -n mkdir "$group" "$group/native" "$group/maintenance"
          sudo -n chmod 0755 "$group" "$group/native" "$group/maintenance"
          sudo -n chown "$(id -u):$(id -g)" "$group/cgroup.procs" "$group/native/cgroup.procs" "$group/native/cgroup.kill" "$group/maintenance/cgroup.procs" "$group/maintenance/cgroup.kill"
          printf '%s\n' "$$" | sudo -n tee "$group/cgroup.procs" >/dev/null
          GITGOOD_VERIFY_CGROUP="$group/native" GITGOOD_VERIFY_RECOVERY=true npm run verify:production
          test "$(awk '$1 == "populated" {print $2}' "$group/native/cgroup.events")" = 0
          test "$(awk '$1 == "populated" {print $2}' "$group/maintenance/cgroup.events")" = 0
        working-directory: apps/web
      - run: node scripts/verification-manifest.mjs
        if: always()
      - name: Stop owned native PostgreSQL
        if: always()
        run: |
          set -euo pipefail
          cluster="$GITHUB_WORKSPACE/.gitgood/postgres-cluster"
          if test -f "$cluster/postmaster.pid"; then
            "$GITHUB_WORKSPACE/.gitgood/postgres-18.4/bin/pg_ctl" -D "$cluster" -m fast -w stop
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: native-forge-verification-${{ github.sha }}
          path: |
            apps/web/test-results/
            apps/web/test-results-production/
            apps/forge/.gitgood/verification/
            .gitgood/native-owned-proof/receipt.json
          retention-days: 7
