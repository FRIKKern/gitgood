name: Verify native forge
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  forge-and-web:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: gitgood
          POSTGRES_PASSWORD: synthetic-db-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gitgood"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: gitgood
      PGPASSWORD: synthetic-db-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '29.1.1'
          elixir-version: '1.20.4'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: mix deps.get --check-locked && mix precommit && mix format --check-formatted
        working-directory: apps/forge
      - name: Verify real database recovery and VM crashes
        working-directory: apps/forge
        env:
          PGDATABASE: gitgood_recovery
          GITGOOD_STORAGE: .gitgood/recovery
        run: |
          mix ecto.create
          mix ecto.migrate
          mix run verification/merge_recovery.exs
          for point in before_ref after_ref before_outcome; do
            set +e
            GITGOOD_FAILURE_POINT="$point" mix run verification/vm_crash.exs
            result=$?
            set -e
            test "$result" -eq 70
            GITGOOD_FAILURE_POINT=reconcile mix run verification/vm_crash.exs
            cp .gitgood/verification/vm-crash.json ".gitgood/verification/vm-crash-$point.json"
          done
      - run: npm ci && npm run check
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start disposable forge
        working-directory: apps/forge
        run: |
          mkdir -p .gitgood/ssh-host
          ssh-keygen -q -t ed25519 -N '' -f .gitgood/ssh-host/ssh_host_ed25519_key
          export GITGOOD_SSH_PORT=47842
          export GITGOOD_SSH_HOST_KEY_DIRECTORY="$PWD/.gitgood/ssh-host"
          mix ecto.create
          mix ecto.migrate
          mix run priv/repo/seeds.exs
          mix phx.server > /tmp/gitgood-forge.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:47841/health/ready; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npx playwright test
        working-directory: apps/web
      - name: Build clean production artifacts
        run: |
          npm run build --prefix apps/web
          node scripts/stamp-build.mjs
          cd apps/forge
          MIX_ENV=prod mix release
      - name: Verify copied production installation
        run: npm run verify:production
        working-directory: apps/web
      - run: node scripts/verification-manifest.mjs
        if: always()
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: native-forge-verification-${{ github.sha }}
          path: |
            apps/web/test-results/
            apps/web/test-results-production/
            apps/forge/.gitgood/verification/
          retention-days: 7
