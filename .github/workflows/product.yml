name: Verify native forge
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  forge-and-web:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: gitgood
          POSTGRES_PASSWORD: synthetic-db-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gitgood"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: gitgood
      PGPASSWORD: synthetic-db-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '29.1.1'
          elixir-version: '1.20.4'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: mix deps.get --check-locked && mix precommit && mix format --check-formatted
        working-directory: apps/forge
      - name: Verify real database recovery and VM crashes
        working-directory: apps/forge
        env:
          PGDATABASE: gitgood_recovery
          GITGOOD_STORAGE: .gitgood/recovery
        run: |
          mix ecto.create
          mix ecto.migrate
          mix run verification/merge_recovery.exs
          for point in before_ref after_ref before_outcome; do
            set +e
            GITGOOD_FAILURE_POINT="$point" mix run verification/vm_crash.exs
            result=$?
            set -e
            test "$result" -eq 70
            GITGOOD_FAILURE_POINT=reconcile mix run verification/vm_crash.exs
            cp .gitgood/verification/vm-crash.json ".gitgood/verification/vm-crash-$point.json"
          done
          for point in before_validation before_ref after_ref before_outcome; do
            set +e
            GITGOOD_FAILURE_POINT="$point" mix run verification/import_vm_crash.exs
            result=$?
            set -e
            test "$result" -eq 70
            GITGOOD_FAILURE_POINT=reconcile mix run verification/import_vm_crash.exs
            cp .gitgood/verification/import-vm-crash.json ".gitgood/verification/import-vm-crash-$point.json"
          done
          for point in before_commit after_commit; do
            set +e
            GITGOOD_FAILURE_POINT="$point" mix run verification/release_vm_crash.exs
            result=$?
            set -e
            test "$result" -eq 70
            GITGOOD_FAILURE_POINT=reconcile mix run verification/release_vm_crash.exs
            cp .gitgood/verification/release-vm-crash.json ".gitgood/verification/release-vm-crash-$point.json"
          done
      - name: Verify populated discovery upgrade and fresh VM
        working-directory: apps/forge
        run: |
          export PGDATABASE="gitgood_activity_upgrade_$(openssl rand -hex 4)"
          export GITGOOD_STORAGE="$PWD/.gitgood/discovery-upgrade"
          GITGOOD_DISCOVERY_MODE=prepare mix run --no-start verification/discovery_upgrade.exs
          GITGOOD_DISCOVERY_MODE=check mix run --no-start verification/discovery_upgrade.exs
      - run: npm ci && npm run check
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Install pinned direct-edge verification runtime
        run: |
          mkdir -p .gitgood/caddy-2.11.7
          curl -fsSL --retry 2 https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz -o .gitgood/caddy-2.11.7/package.tar.gz
          echo 'a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7  .gitgood/caddy-2.11.7/package.tar.gz' | sha512sum --check
          tar -xzf .gitgood/caddy-2.11.7/package.tar.gz -C .gitgood/caddy-2.11.7 caddy
          echo "GITGOOD_CADDY=$PWD/.gitgood/caddy-2.11.7/caddy" >> "$GITHUB_ENV"
      - name: Build clean production artifacts
        run: |
          npm run build --prefix apps/web
          node scripts/stamp-build.mjs
          cd apps/forge
          MIX_ENV=prod mix release
      - name: Verify copied production installation
        run: npm run verify:production
        working-directory: apps/web
      - run: node scripts/verification-manifest.mjs
        if: always()
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: native-forge-verification-${{ github.sha }}
          path: |
            apps/web/test-results/
            apps/web/test-results-production/
            apps/forge/.gitgood/verification/
          retention-days: 7
