name: Verify planning foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  planning:
    runs-on: [self-hosted, Linux, X64, gitgood-isolated-v1]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm run check
