name: Planning freshness
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
jobs:
  freshness:
    if: vars.GITGOOD_MAINTENANCE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm run check
      - run: npm run freshness
# Configure authenticated source reconciliation and deduplicated alerts in S16
# before enabling this gate. This workflow neither fetches sources nor writes main.
