<text x="1164" y="78" font-size="17" class="strong" text-anchor="end">8 milestones / 17 journeys</text>
<text x="36" y="112" font-size="23" class="strong" >From first private push to a complete managed forge.</text>
<text x="36" y="143" font-size="16" class="muted" >Milestone-based Gantt · sequence and overlap, not elapsed time</text>
