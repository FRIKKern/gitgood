<g data-phase="M0"><title>M0 Scope and ownership. Confirm private-team scope, ownership, identity boundary, and open experiments. Exit gate: Recorded bounded execution baseline; delegated agent authority; J01/J02 scenarios and data ownership. Foundation.</title>
<text x="36" y="348" font-size="14" class="accent mono strong" >M0</text>
<text x="79" y="348" font-size="19" class="strong" >Scope and ownership</text>
<text x="79" y="373" font-size="14" class="muted" >GitHub · specifications and decisions</text>
<rect x="476" y="340" width="74.75" height="36" rx="6" class="delivery"/>
<text x="513.375" y="364" font-size="15" class="strong" text-anchor="middle">M0</text>
<path d="M36 404L1164 404" class="rule"/>
</g>
<g data-phase="M1"><title>M1 Repository ready. Scaffold app/API, isolated Postgres, runtimes, real request contract, local setup, CI. Exit gate: Fresh checkout runs; browser reaches API; secrets stay server-side; isolated migrations and tests pass. After M0.</title>
<text x="36" y="434" font-size="14" class="accent mono strong" >M1</text>
<text x="79" y="434" font-size="19" class="strong" >Repository ready</text>
<text x="79" y="459" font-size="14" class="muted" >Local browser · Elixir API · Postgres</text>
<rect x="562.75" y="426" width="74.75" height="36" rx="6" class="delivery"/>
<text x="600.125" y="450" font-size="15" class="strong" text-anchor="middle">M1</text>
<path d="M36 490L1164 490" class="rule"/>
</g>
<g data-phase="M2"><title>M2 Private repository slice. Complete J01/J02 and minimal J04 with real Git clients and two identities. Exit gate: Authorized create/clone/push/browse; unauthorized reads/writes denied; timeouts and cleanup verified. After M1.</title>
<text x="36" y="520" font-size="14" class="accent mono strong" >M2</text>
<text x="79" y="520" font-size="19" class="strong" >Private repository slice</text>
<text x="79" y="545" font-size="14" class="muted" >Gitgood browser · terminal Git client</text>
<rect x="649.5" y="512" width="74.75" height="36" rx="6" class="delivery"/>
<text x="686.875" y="536" font-size="15" class="strong" text-anchor="middle">M2</text>
<path d="M36 576L1164 576" class="rule"/>
</g>
<g data-phase="M3"><title>M3 Review and merge foundation. Complete review, check reporting, protected merge, and interruption recovery; start packaging experiment. Exit gate: Concurrent and stale-state behavior proven; exact result reconciles after service failure. After M2.</title>
<text x="36" y="606" font-size="14" class="accent mono strong" >M3</text>
<text x="79" y="606" font-size="19" class="strong" >Review and merge foundation</text>
<text x="79" y="631" font-size="14" class="muted" >Gitgood pull requests · checks · audit</text>
<rect x="736.25" y="598" width="74.75" height="36" rx="6" class="delivery"/>
<text x="773.625" y="622" font-size="15" class="strong" text-anchor="middle">M3</text>
<path d="M36 662L1164 662" class="rule"/>
</g>
<g data-phase="M4"><title>M4 Usable private forge. Add SSH, import, fuller browsing, releases, and permission-aware activity. Exit gate: Pilot daily workflow works; compatibility limitations and measured performance targets are documented. After M3.</title>
<text x="36" y="692" font-size="14" class="accent mono strong" >M4</text>
<text x="79" y="692" font-size="19" class="strong" >Usable private forge</text>
<text x="79" y="717" font-size="14" class="muted" >Gitgood pilot installation</text>
<rect x="823" y="684" width="74.75" height="36" rx="6" class="delivery"/>
<text x="860.375" y="708" font-size="15" class="strong" text-anchor="middle">M4</text>
<path d="M36 748L1164 748" class="rule"/>
</g>
<g data-phase="M5"><title>M5 Connected workspace. Adopt verified Barkpark capabilities and revision-specific evidence. Exit gate: Links preserve both owners&apos; permissions; current/stale verification is clear; scoped agent APIs follow ordinary rules. After M4.</title>
<text x="36" y="778" font-size="14" class="accent mono strong" >M5</text>
<text x="79" y="778" font-size="19" class="strong" >Connected workspace</text>
<text x="79" y="803" font-size="14" class="muted" >Gitgood + supported Barkpark APIs</text>
<rect x="909.75" y="770" width="74.75" height="36" rx="6" class="delivery"/>
<text x="947.125" y="794" font-size="15" class="strong" text-anchor="middle">M5</text>
<path d="M36 834L1164 834" class="rule"/>
</g>
<g data-phase="M6"><title>M6 Managed lifecycle. Finish Cloud launch, upgrade, restore, export/archive; recovery research starts earlier. Exit gate: Clean install, unhealthy-release rejection, real replacement-host restore, supported export and removal. After M5.</title>
<text x="36" y="864" font-size="14" class="accent mono strong" >M6</text>
<text x="79" y="864" font-size="19" class="strong" >Managed lifecycle</text>
<text x="79" y="889" font-size="14" class="muted" >Barkpark Cloud · deployed Gitgood host</text>
<rect x="996.5" y="856" width="74.75" height="36" rx="6" class="delivery"/>
<text x="1033.875" y="880" font-size="15" class="strong" text-anchor="middle">M6</text>
<path d="M36 920L1164 920" class="rule"/>
</g>
<g data-phase="M7"><title>M7 First complete release. Complete bounded pilot and reconcile all accepted scope, artifact identity, runbooks, and evidence. Exit gate: Every required journey has current release-candidate evidence; no blocking correctness gap; agent evaluations pass all evidence gates without human sign-off. After M6.</title>
<text x="36" y="950" font-size="14" class="accent mono strong" >M7</text>
<text x="79" y="950" font-size="19" class="strong" >First complete release</text>
<text x="79" y="975" font-size="14" class="muted" >Private release artifacts · Cloud · pilot</text>
<rect x="1083.25" y="942" width="74.75" height="36" rx="6" class="delivery"/>
<text x="1120.625" y="966" font-size="15" class="strong" text-anchor="middle">M7</text>
<path d="M36 1006L1164 1006" class="rule"/>
</g>
<text x="36" y="1036" font-size="12" class="muted label" >SUPPORTING WORK / PROPOSED OVERLAP</text>
<g data-track="R1"><title>R1 Barkpark contract research. Proposed early research; verify supported APIs and permissions before adoption at M5. Overlap requires available execution capacity.</title>
